name: Fork Tests

# 这个 fork 的回归门禁。docker-build.yml 只构建镜像（里面 next build 会挡类型错误），
# 但没有任何 job 跑过 pytest —— 这里补上，避免「CI 绿 = 逻辑没坏」的误解。
#
# 跑全量 pytest tests/（106 个测试文件、约 2200 项），覆盖：
#   - 本 fork 的分类器 / 衰减 / 重排与服务端 REST 行为
#   - 上游 SDK 的内存层、client、vector store、llms、embeddings 用例
# 需要外部服务或未安装可选 provider 的用例会自行 skip（约 76 项），这是预期行为。
#
# 依赖与上游 ci.yml 对齐（[test,llms,extras] + 系统 libgeos），另外补上本 fork 的
# server 运行时依赖（fastapi / psycopg / slowapi 等）；不装这些的话，服务端用例会被
# pytest.importorskip 静默跳过，门禁就形同虚设。
#
# 历史：本 job 曾只跑 tests/memory + test_server_memory_categories.py，导致根目录的
# tests/test_decay*.py 长期不被 CI 覆盖 —— 2026-11-14 有一个随日历腐化的测试在 main
# 上红了数周才被发现。因此改为全量；如果只想跑快路径，请另开 job 而不是砍掉这里。

on:
  push:
    branches: [main]
    paths:
      - "mem0/**"
      - "server/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/fork-tests.yml"
  pull_request:
    paths:
      - "mem0/**"
      - "server/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/fork-tests.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgeos-dev
          python -m pip install --upgrade pip
          pip install -e ".[test,vector-stores,llms,extras]" pgvector \
            "fastapi==0.115.8" "pydantic[email]==2.10.4" python-dotenv requests \
            "psycopg[binary]" psycopg-pool sqlalchemy "passlib[bcrypt]" \
            "bcrypt==4.0.1" "python-jose[cryptography]" cryptography slowapi

      - name: Run tests
        # PYTHONPATH 要同时含仓库根（mem0 包）和 server/（telemetry/auth 是顶层模块）
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/server
        run: pytest tests/ -q

  dashboard-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: server/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # ⚠️ 不加 `pnpm lint`（prettier --check）：仓库里 13 个源文件是按旧版 prettier 格式写的，
      # 当前版本（3.8.x，package.json 为 ^3.5.2）会重排约 270 行。要开这个门禁，先固定 prettier 版本
      # 并跑一次全量 `prettier --write`，否则 CI 会一直红。
