name: mem0

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mem0-postgres
    restart: unless-stopped
    shm_size: "128mb"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mem0}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-mem0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB:-mem0} -U ${POSTGRES_USER:-mem0}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "15432:5432"
    networks:
      - mem0

  mem0-server:
    image: ghcr.io/hh127/mem0-server:main
    container_name: mem0-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mem0}
      - POSTGRES_USER=${POSTGRES_USER:-mem0}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - APP_DB_NAME=mem0_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6688:8000"
    networks:
      - mem0

  mem0-dashboard:
    image: ghcr.io/hh127/mem0-dashboard:main
    container_name: mem0-dashboard
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://${NAS_IP:-192.168.4.132}:6688
      - API_INTERNAL_URL=http://mem0-server:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      - mem0-server
    ports:
      - "3000:3000"
    networks:
      - mem0

volumes:
  postgres_data:

networks:
  mem0:
    driver: bridge
