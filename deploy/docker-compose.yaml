name: mem0

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mem0-postgres
    restart: unless-stopped
    shm_size: "128mb"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mem0}
      # 必填：留空时 compose 会拒绝启动（deploy/.env 里没填 POSTGRES_PASSWORD）
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      - POSTGRES_DB=${POSTGRES_DB:-mem0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB:-mem0} -U ${POSTGRES_USER:-mem0}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      # 只绑本机回环，供 NAS 本机排查用；不需要就整段删掉。
      # 千万不要写成 "15432:5432" —— 那会把数据库暴露给整个局域网。
      - "127.0.0.1:15432:5432"
    networks:
      - mem0

  mem0-server:
    image: ghcr.io/hh127/mem0-server:main
    container_name: mem0-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mem0}
      - POSTGRES_USER=${POSTGRES_USER:-mem0}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      - APP_DB_NAME=mem0_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6688:8000"
    networks:
      - mem0

  # 全新独立控制台（替换官方 dashboard）。同源反代 /api/*，登录态用 httpOnly cookie，
  # 因此不再需要 NAS_IP / NEXT_PUBLIC_API_URL，也不依赖 CORS。
  # 首次部署在本目录执行 `docker compose build mem0-console` 从仓库内构建；
  # 发布镜像后可以直接 `docker compose pull mem0-console`。
  mem0-console:
    image: ghcr.io/hh127/mem0-console:main
    build:
      context: ../server/console
      args:
        VITE_INSTANCE_NAME: Mem0
    container_name: mem0-console
    restart: unless-stopped
    environment:
      - API_UPSTREAM=http://mem0-server:8000
    depends_on:
      mem0-server:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - mem0

volumes:
  postgres_data:

networks:
  mem0:
    driver: bridge
